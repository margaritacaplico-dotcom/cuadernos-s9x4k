 *{box-sizing:border-box} body{margin:0;font-family:Nunito;color:#2a2f3a}
.pg{width:8.5in;height:11in;padding:.45in .5in .4in;page-break-after:always;position:relative;display:flex;flex-direction:column;overflow:hidden}
.hdr{display:flex;align-items:stretch;gap:12px;border:3px solid var(--c);border-radius:18px;overflow:hidden}
.code{background:var(--c);color:#fff;font:700 30px Fredoka;padding:14px 18px;display:flex;align-items:center}
.ttl{flex:1;padding:8px 0;display:flex;flex-direction:column;justify-content:center} .ttl b{font:700 28px Fredoka} .ttl span{font-size:13px;color:#6b7380}
.sheet{border-left:3px solid var(--c);padding:6px 16px;text-align:center;font-size:12px;color:#6b7380;line-height:1.1} .sheet b{display:block;font:700 34px Fredoka;color:#2a2f3a}
.meta{display:flex;justify-content:space-between;font-size:14px;margin:10px 4px 4px;color:#4a5260}
.instr{background:var(--t);border-radius:14px;padding:12px 16px;font-size:17px;margin:8px 0 14px;display:flex;gap:10px;align-items:flex-start}
.instr .ic{color:var(--c);font-size:20px}
.body{flex:1;display:flex;flex-direction:column;justify-content:center}
.sub{font:700 17px Nunito;margin:14px 0 4px}
.ftr{display:flex;justify-content:space-between;font-size:11px;color:#9aa3ae;border-top:1px solid #e7e0d4;padding-top:6px}
.stars{letter-spacing:3px;color:var(--c);font-size:13px}
.eval{margin-top:10px;font-size:14px;background:#fff7e6;border-radius:12px;padding:10px 14px}
.cover .band{position:absolute;top:0;left:0;right:0;height:.28in;background:linear-gradient(90deg,#e04b4b,#ea7a2b,#e3b322,#4fae5b,#2f8fcf,#5a63c9,#8a4fb8)}
.cv-top{margin-top:.3in;display:flex;align-items:center;gap:16px}
.cv-code{background:var(--c);color:#fff;font:700 40px Fredoka;padding:8px 20px;border-radius:16px}
.cv-sub{font:700 16px Nunito;color:#6b7380}
.cover h1{font:700 60px Fredoka;margin:18px 0 0}
.cv-name{font:600 24px Fredoka;margin-bottom:12px}
.cv-box{border:2.5px solid var(--c);border-radius:18px;padding:8px 20px 14px;font-size:15.5px;line-height:1.5}
.cv-box h3{font:700 18px Fredoka;color:var(--c);margin:8px 0 4px} .cv-box p{margin:5px 0}
.reg{width:100%;border-collapse:collapse;margin-top:14px;font-size:12px} .reg th,.reg td{border:1.5px solid #c7cfd8;padding:12px 4px;text-align:center} .reg th{background:var(--t)} .reg td:first-child{font-weight:700;width:70px}
.cv-ftr{margin-top:auto;font-size:11px;color:#9aa3ae;text-align:center}
html,body{margin:0;height:100%;background:#f3eee6;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;font-family:Nunito,system-ui,sans-serif;color:#26303d}
button{font-family:Nunito,system-ui,sans-serif}
textarea,input{-webkit-user-select:text!important;user-select:text!important;-webkit-touch-callout:default!important;touch-action:auto!important}
.screen{position:absolute;inset:0;overflow:auto;touch-action:pan-y;padding:24px 20px 40px;display:none}
h1{font:700 32px Fredoka,sans-serif;margin:0}
.sub2{color:#6b7380;margin:4px 0 18px;font-size:17px}
.rb{height:8px;border-radius:8px;background:linear-gradient(90deg,#e04b4b,#ea7a2b,#e3b322,#4fae5b,#2f8fcf,#5a63c9,#8a4fb8);margin:12px 0 18px}
.books{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;max-width:1100px}
.bk{all:unset;cursor:pointer;background:#fff;border-radius:24px;border:3px solid var(--c);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 6px 0 var(--c)}
.bk:active{transform:translateY(4px);box-shadow:0 2px 0 var(--c)}
.bk .top{background:var(--c);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
.bk .top b{font:700 28px Fredoka,sans-serif}
.bk .top span{font:700 17px Nunito}
.bk .mid{padding:12px 20px 16px}
.dots{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.dots i{width:30px;height:30px;border-radius:50%;background:#efe9df;display:grid;place-items:center;font-style:normal;font-size:16px}
.dots i.ok{background:var(--c);color:#fff}
.pbar{height:12px;border-radius:12px;background:#efe9df;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--c)}
.note{max-width:1100px;margin-top:20px;font-size:14.5px;color:#6b7380;background:#fff;border-radius:16px;padding:14px 18px}
.big{font-size:80px;text-align:center;margin:30px 0 6px}
#reader{position:absolute;inset:0;display:none;touch-action:none}
#frame,#sheet,#ink,#ov{touch-action:none;-webkit-user-select:none;-webkit-touch-callout:none}
#stage{position:absolute;left:0;right:0;top:0;bottom:var(--bh,132px);display:flex;align-items:center;justify-content:center}
#frame{position:relative;background:#fff;box-shadow:0 4px 18px rgba(0,0,0,.12);border-radius:6px;overflow:hidden}
#sheet{position:absolute;left:0;top:0;width:816px;height:1056px;transform-origin:0 0}
#sheet .pg{position:absolute;left:0;top:0;background:#fff}
#ink,#ov{position:absolute;left:0;top:0;width:816px;height:1056px}
#ov{pointer-events:none}
#bar{position:absolute;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #e3dccf;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
.tb{all:unset;cursor:pointer;min-width:52px;height:56px;border-radius:16px;display:inline-flex;align-items:center;justify-content:center;font-size:26px;background:#f3eee6;flex:none}
.tb.on{outline:3px solid #26303d}
.tb.wide{padding:0 16px;font:800 18px Nunito}
.tb.go{background:#3d9a5b;color:#fff}
.sw{all:unset;cursor:pointer;width:40px;height:40px;border-radius:50%;flex:none;border:3px solid #fff;box-shadow:0 0 0 2px #d8d0c3}
.sw.on{box-shadow:0 0 0 4px #26303d}
.sep{width:1px;height:44px;background:#e3dccf;flex:none}
#pl{font:800 16px Nunito;min-width:74px;text-align:center;flex:none}
.pop{position:absolute;font-size:64px;pointer-events:none;animation:pop .9s ease-out forwards;transform:translate(-50%,-50%)}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}30%{opacity:1;transform:translate(-50%,-70%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-150%) scale(1)}}
#modal{position:absolute;inset:0;background:rgba(20,24,30,.45);display:none;align-items:center;justify-content:center;z-index:9}
#modal .card{background:#fff;border-radius:28px;padding:26px 28px;text-align:center;max-width:460px;width:86%}
#modal .stars{font-size:58px;letter-spacing:6px}
#modal h2{font:700 28px Fredoka,sans-serif;margin:8px 0}
#modal p{font-size:17px;color:#4a5260;margin:6px 0 18px}
#modal .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
/* parents */
#parents{background:#fbf7f0}
#parents h2{font:700 21px Fredoka,sans-serif;margin:22px 0 8px}
.pcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.pc{background:#fff;border:1px solid #e7e0d4;border-top:6px solid var(--c);border-radius:16px;padding:12px 14px}
.pc .k{font:700 13px Nunito;color:#6b7380}
.pc .v{font:700 26px Fredoka}
table{border-collapse:collapse;width:100%;background:#fff;border-radius:14px;overflow:hidden;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid #eee5d8;text-align:left;vertical-align:top}
th{background:#f3eee6;font-weight:800}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:800;background:#f1ebe1}
.tag.g{background:#d9efdc;color:#1f6a2c}.tag.y{background:#fff1d6;color:#8a5a00}.tag.r{background:#fde2e2;color:#9b2c2c}
.lvmap{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.lvmap i{width:24px;height:20px;border-radius:5px;background:#efe9df;font:700 9px Nunito;display:grid;place-items:center;font-style:normal;color:#8a8f98}
.lvmap i.d{background:var(--c);color:#fff}.lvmap i.c{outline:2px solid var(--c);background:#fff;color:#26303d}
.ptabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.ptabs button{all:unset;cursor:pointer;padding:8px 14px;border-radius:999px;font:800 14px Nunito;background:#efe9df}
.ptabs button.on{background:#26303d;color:#fff}
@media (max-width:600px){.tb{min-width:40px;height:42px;font-size:20px;border-radius:12px}.tb.wide{font-size:15px;padding:0 10px}.sw{width:30px;height:30px}#bar{gap:5px;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}#pl{font-size:13px;min-width:58px}.sep{display:none}}

/* ===================== Sheet templates =====================
   Each template: (params, rng) => {title, body (html), instr (adult text), say (audio key), hand, handtxt}
   Interactive markup classes understood by the engine:
   .tap[data-q][data-ok]   (q starting with r/e/v = one answer per group)
   .tap.fill  .tap.paint[data-need]  .dot[data-s=L|R][data-k]  .chk  .snd[data-k]
*/
const INK = "#2a2f3a";
function rng(seed){ let s = (seed >>> 0) || 1; return () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return ((s >>> 0) % 100000) / 100000; }; }
function shuffle(a, R){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j = Math.floor(R()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function svg(w, h, body){ return `<svg viewBox="0 0 ${w} ${h}" width="100%" xmlns="http://www.w3.org/2000/svg">${body}</svg>`; }
function T(x, y, t, size, color=INK, weight=800, anchor="middle", fam="Nunito"){ return `<text x="${x}" y="${y}" font-family="${fam}" font-weight="${weight}" font-size="${size}" text-anchor="${anchor}" fill="${color}">${esc(t)}</text>`; }
function trace(t, x, y, size){ return `<text x="${x}" y="${y}" font-family="Nunito" font-weight="800" font-size="${size}" text-anchor="middle" fill="none" stroke="#9aa3ae" stroke-width="${Math.max(2,size/70).toFixed(1)}" stroke-dasharray="${Math.round(size/22)} ${Math.round(size/22)}">${esc(t)}</text>`; }
function box(x, y, w, h, c, t, r=20){ return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${t}" stroke="${c}" stroke-width="3"/>`; }
function card(x, y, w, h){ return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="16" fill="#fff" stroke="#e7e0d4" stroke-width="2"/>`; }
/* picture: art (colorable) if available, otherwise emoji */
let _pc = 0;
function P(id, x, y, size, outline){
  if(typeof PERS !== "undefined" && PERS.DOGS && PERS.DOGS[id]) return `<g transform="translate(${x},${y}) scale(${(size/100).toFixed(3)})">${PERS.DOGS[id]}</g>`;
  if(ART[id]) return `<g transform="translate(${x},${y}) scale(${(size/95).toFixed(3)})">${outline ? ART[id].o : ART[id].c}</g>`;
  const e = (BANK[id] || ["❓"])[0];
  return `<text x="${x}" y="${y + size*0.36}" font-size="${size*0.92}" text-anchor="middle">${e}</text>`;
}
function word(id, lang){ const b = BANK[id]; return b ? (lang === "en" ? b[1] : b[2]) : id; }
function group(id, n, cx, cy, size, maxW){
  // lays out n pictures centered at cx, wrapping in rows of 5
  const per = n > 5 ? Math.ceil(n/2) : n, rows = Math.ceil(n/per);
  const gap = Math.min(size*1.15, maxW / per);
  const s = Math.min(size, gap*0.95);
  let out = "";
  for(let i=0;i<n;i++){ const r = Math.floor(i/per), c = i % per, inRow = Math.min(per, n - r*per);
    out += P(id, cx + (c - (inRow-1)/2)*gap, cy + (r - (rows-1)/2)*s*1.05, s); }
  return out;
}
function optCircles(q, opts, ok, x0, y, r=34, gap=82, size=52){
  return opts.map((o, j) => `<g class="tap" data-q="${q}" data-ok="${o == ok ? 1 : 0}"><circle cx="${x0 + j*gap}" cy="${y}" r="${r}" fill="#fff" stroke="#c7cfd8" stroke-width="2"/>${T(x0 + j*gap, y + size*0.36, o, size)}</g>`).join("");
}

const TPL = {};

TPL.trace = (p, R, S) => {
  // p: {glyph:"1"|"s"|"A a", model?, pic?, n?}
  const g = String(p.glyph); const glyphs = g.split(" ");
  let top = box(10, 10, 300, 300, S.c, S.t, 24) + T(160, 255, g, g.length > 2 ? 160 : 250, S.c);
  if(p.pic){ const n = p.n || 1, size = n > 3 ? 70 : 100, gap = Math.min(size*1.15, 380/n);
    for(let i=0;i<n;i++){ const x = 520 + (i-(n-1)/2)*gap; top += ART[p.pic] ? `<g class="tap paint free" data-q="x${i}" data-need="-1">${P(p.pic, x, 160, size, true)}</g>` : P(p.pic, x, 160, size); } }
  const row = Array.from({length: 6}, (_, i) => trace(glyphs[i % glyphs.length], 65 + i*118, 150, 150)).join("");
  const row2 = Array.from({length: 6}, (_, i) => trace(glyphs[(i+1) % glyphs.length], 65 + i*118, 150, 150)).join("");
  return { title: p.title || `Repasa: ${g}`, body: svg(720, 330, top) + `<p class="sub">Repasa siguiendo los puntitos:</p>` + svg(720, 175, row) + svg(720, 175, row2),
    instr: p.pic ? `Colorea ${p.n || 1} y repasa «${g}» siguiendo los puntos.` : `Repasa «${g}» siguiendo los puntos, en la dirección correcta.`,
    say: p.pic ? "t:trace_color" : "t:trace", hand: 1, handtxt: "repasó siguiendo los puntos" };
};

TPL.count_circle = (p, R, S) => {
  // p: {rows:[{n, pic}], options:[...]}
  const rows = p.rows.slice(0, 4); const opts = p.options || [1,2,3];
  const H = rows.length * 160 + 20; let b = "";
  const gap = opts.length > 3 ? 64 : 84, r = opts.length > 3 ? 28 : 34, fs = opts.length > 3 ? 40 : 52;
  const x0 = 720 - gap*(opts.length-1) - r - 14;
  rows.forEach((row, i) => { const y = 90 + i*160;
    b += `<line x1="10" y1="${y+75}" x2="710" y2="${y+75}" stroke="#e7e0d4" stroke-width="2"/>` + group(row.pic, row.n, (x0 - 60)/2 + 10, y, row.n > 5 ? 52 : 74, x0 - 90);
    b += optCircles("r" + i, opts, row.n, x0, y, r, gap, fs); });
  return { title: p.title || "Cuenta y encierra", body: svg(720, H, b), instr: "Cuenta los dibujos de cada fila tocándolos uno por uno. Encierra el número que dice cuántos hay.", say: "t:count_circle" };
};

TPL.match_count = (p, R, S) => {
  const L = p.items.slice(0, 4); const right = shuffle(L.map(x => x.n), R);
  const H = L.length * 175 + 20; let b = "";
  L.forEach((it, i) => { const y = 100 + i*175;
    b += card(10, y - 78, 340, 156) + group(it.pic, it.n, 180, y, it.n > 5 ? 46 : 70, 300) + `<circle class="dot" data-s="L" data-k="${it.n}" cx="370" cy="${y}" r="10" fill="${S.c}"/>`;
    b += `<circle class="dot" data-s="R" data-k="${right[i]}" cx="500" cy="${y}" r="10" fill="${S.c}"/>` + box(540, y - 66, 150, 132, S.c, S.t, 18) + T(615, y + 38, right[i], 104); });
  return { title: p.title || "Une el grupo con su número", body: svg(720, H, b), instr: "Cuenta cada grupo y traza una línea desde el punto del grupo hasta el punto de su número.", say: "t:match_count" };
};

TPL.color_n = (p, R, S) => {
  // p: {rows:[n...], pic, total:5}
  const tot = p.total || 5; const rows = p.rows.slice(0, 4); const H = rows.length * 190 + 20; let b = "";
  const pic = ART[p.pic] ? p.pic : "dino";
  rows.forEach((n, i) => { const y = 105 + i*190;
    b += box(10, y - 72, 110, 144, S.c, S.t, 18) + T(65, y + 38, n, 104);
    const gap = 560 / tot, s = Math.min(100, gap * 0.95);
    for(let k=0;k<tot;k++) b += `<g class="tap paint" data-q="d${i}" data-need="${n}">` + P(pic, 175 + gap/2 + k*gap, y + 10, s, true) + `</g>`; });
  return { title: p.title || "Colorea solo los que dice el número", body: svg(720, H, b), instr: `En cada fila colorea SOLO la cantidad que dice el número. Los demás se quedan blancos.`, say: "t:color_n" };
};

TPL.draw_n = (p, R, S) => {
  const nums = p.nums.slice(0, 4); const H = nums.length * 190 + 20; let b = "";
  nums.forEach((n, i) => { const y = 105 + i*190;
    b += box(10, y - 75, 130, 150, S.c, S.t, 18) + T(75, y + 42, n, 110) + `<rect x="170" y="${y-80}" width="530" height="160" rx="22" fill="#fff" stroke="${INK}" stroke-width="3" stroke-dasharray="10 8"/>`; });
  return { title: p.title || "Dibuja la cantidad", body: svg(720, H, b), instr: "Dibuja en cada caja tantas bolitas como dice el número.", say: "t:draw_n", hand: nums.length, handtxt: "cada caja con la cantidad correcta" };
};

TPL.write_n = (p, R, S) => {
  const rows = p.rows.slice(0, 4); const H = rows.length * 165 + 20; let b = "";
  rows.forEach((row, i) => { const y = 95 + i*165;
    b += `<line x1="10" y1="${y+75}" x2="710" y2="${y+75}" stroke="#e7e0d4" stroke-width="2"/>` + group(row.pic, row.n, 250, y, row.n > 5 ? 50 : 70, 440);
    b += `<rect x="540" y="${y-65}" width="150" height="130" rx="16" fill="#fff" stroke="${INK}" stroke-width="3"/>` + (i < (p.guided || 0) ? trace(row.n, 615, y + 45, 120) : ""); });
  return { title: p.title || "Cuenta y escribe", body: svg(720, H, b), instr: "Cuenta los dibujos y escribe el número en la caja.", say: "t:write_n", hand: rows.length, handtxt: "cada número escrito correcto y legible" };
};

TPL.compare = (p, R, S) => {
  // p: {rows:[{a:{n,pic}, b:{n,pic}}], ask:"more"|"less"}
  const rows = p.rows.slice(0, 4); const H = rows.length * 175 + 20; let b = ""; const less = p.ask === "less";
  rows.forEach((row, i) => { const y = 100 + i*175;
    const okA = less ? row.a.n < row.b.n : row.a.n > row.b.n;
    b += `<g class="tap" data-q="r${i}" data-ok="${okA ? 1 : 0}">` + card(10, y - 75, 330, 150) + group(row.a.pic, row.a.n, 175, y, row.a.n > 5 ? 44 : 62, 300) + `</g>`;
    b += `<g class="tap" data-q="r${i}" data-ok="${okA ? 0 : 1}">` + card(380, y - 75, 330, 150) + group(row.b.pic, row.b.n, 545, y, row.b.n > 5 ? 44 : 62, 300) + `</g>`; });
  return { title: p.title || (less ? "¿Dónde hay menos?" : "¿Dónde hay más?"), body: svg(720, H, b), instr: less ? "En cada fila encierra el grupo que tiene MENOS." : "En cada fila encierra el grupo que tiene MÁS.", say: less ? "t:compare_less" : "t:compare" };
};

TPL.add_pics = (p, R, S) => {
  // p: {rows:[{a,b,pic,options}], sub?:true, symbols?:true}
  const rows = p.rows.slice(0, 4); const H = rows.length * 165 + 20; let b = "";
  rows.forEach((row, i) => { const y = 95 + i*165; const opts = row.options;
    b += `<line x1="10" y1="${y+75}" x2="710" y2="${y+75}" stroke="#e7e0d4" stroke-width="2"/>`;
    if(p.sub){ const tot = row.a; let g = group(row.pic, tot, 210, y, tot > 5 ? 46 : 62, 380);
      b += g; const per = tot > 5 ? Math.ceil(tot/2) : tot; const gap = Math.min((tot > 5 ? 46 : 62)*1.15, 380/per);
      for(let k=0;k<row.b;k++){ const idx = tot-1-k, r = Math.floor(idx/per), c = idx % per, inRow = Math.min(per, tot - r*per), rowsN = Math.ceil(tot/per);
        const cx = 210 + (c - (inRow-1)/2)*gap, cy = y + (r - (rowsN-1)/2)*(tot > 5 ? 46 : 62)*1.05; b += `<path d="M${cx-24},${cy-24} L${cx+24},${cy+24} M${cx+24},${cy-24} L${cx-24},${cy+24}" stroke="#e04b4b" stroke-width="6" stroke-linecap="round"/>`; }
      if(p.symbols) b += T(210, y + 66, `${row.a} − ${row.b} =`, 26, "#6b7380", 800);
    } else {
      b += group(row.pic, row.a, 110, y, 52, 190) + T(222, y + 16, "+", 48, "#6b7380") + group(row.pic, row.b, 335, y, 52, 190);
      if(p.symbols) b += T(222, y + 66, `${row.a} + ${row.b} =`, 26, "#6b7380", 800);
    }
    b += optCircles("r" + i, opts, p.sub ? row.a - row.b : row.a + row.b, 720 - 64*(opts.length-1) - 42, y, 28, 64, 40); });
  return { title: p.title || (p.sub ? "¿Cuántos quedan?" : "¿Cuántos hay en total?"), body: svg(720, H, b),
    instr: p.sub ? "Cuenta los dibujos que NO están tachados. Encierra cuántos quedan." : "Cuenta los dos grupos juntos y encierra cuántos hay en total.", say: p.sub ? "t:sub_pics" : "t:add_pics" };
};

TPL.sequence = (p, R, S) => {
  // p: {rows:[{seq:[1,2,null,4], options:[..]}]}
  const rows = p.rows.slice(0, 4); const H = rows.length * 165 + 20; let b = "";
  rows.forEach((row, i) => { const y = 95 + i*165; const n = row.seq.length; const w = 400 / n;
    let miss = null;
    row.seq.forEach((v, k) => { const x = 20 + k*w; if(v === null || v === undefined){ miss = k; b += `<rect x="${x+4}" y="${y-40}" width="${w-8}" height="80" rx="12" fill="#fff" stroke="${S.c}" stroke-width="3" stroke-dasharray="8 6"/>` + T(x + w/2, y + 18, "?", 46, S.c); }
      else b += `<rect x="${x+4}" y="${y-40}" width="${w-8}" height="80" rx="12" fill="${S.t}" stroke="${S.c}" stroke-width="2"/>` + T(x + w/2, y + 18, v, 46); });

function laneD(pts){ return "M" + pts.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" L"); }
function lane(pts, w, c){ const d = laneD(pts);
  return `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${w+6}" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="#fff" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="#c9d3cc" stroke-width="2" stroke-dasharray="6 10"/><circle cx="${pts[0][0].toFixed(1)}" cy="${pts[0][1].toFixed(1)}" r="9" fill="${c}"/>`; }
const SHAPES = {
  straight: x => 0, curve: x => 28*Math.sin(x/70), wave: x => 30*Math.sin(x/38), hills: x => 30 - 60*Math.abs(Math.sin(x*Math.PI/147)),
  zigzag: x => { const t = (x % 80) / 80; return (t < .5 ? t*2 : 2 - t*2)*60 - 30; },
  corners: x => (Math.floor(x/90) % 2 ? -30 : 30), loops: x => 28*Math.sin(x/22)
};
TPL.paths = (p, R, S) => {
  // p: {shapes:["curve","wave",...] (1-4), width:60}

  sh.forEach((name, i) => { const f = SHAPES[name] || SHAPES.curve; const cy = gap*(i + .5);
    const pts = []; for(let x=150;x<=590;x+=4) pts.push([x, cy + f(x - 150)]);
    b += P("dino", 70, cy + 10, 60) + lane(pts, w, S.c) + P("egg", 655, pts[pts.length-1][1], 60); });
  return { title: p.title || "Lleva al dinosaurio a su huevo", body: svg(720, 640, b), instr: "Desde el punto verde, sin levantar el lápiz y sin salirse del camino.", say: "t:paths", hand: sh.length, handtxt: "cada camino: llegó a la meta saliéndose máximo 1 vez" };
};

const SHAPE_SVG = {
  circle: (x, y, r, st) => `<circle cx="${x}" cy="${y}" r="${r}" fill="none" ${st}/>`,
  cross: (x, y, r, st) => `<path d="M${x},${y-r} L${x},${y+r} M${x-r},${y} L${x+r},${y}" fill="none" ${st}/>`,

  x: (x, y, r, st) => `<path d="M${x-r},${y-r} L${x+r},${y+r} M${x+r},${y-r} L${x-r},${y+r}" fill="none" ${st}/>`,

/* ---------- colored objects + Listen and repeat (Kumon-style English) ---------- */
const CHEX = {red:"#e5483f", blue:"#2f7fd1", yellow:"#f5c518", green:"#4fae5b", pink:"#f06ba8", brown:"#9a6a3e", black:"#3a3d44", white:"#ffffff", orange:"#f58a1f", purple:"#8a4fb8"};
const DEFC = {dress:"pink", pencil:"green", leaf:"green", table:"brown", umbrella:"red", flower:"yellow", cap:"blue", bird:"blue", ball:"orange", car:"red", cup:"blue", kite:"purple", fish:"orange", book:"green", chair:"brown", egg:"white", apple:"red", balloon:"red", hat:"black", star:"yellow"};
function shade(hex, f){ const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255; if(hex.toLowerCase() === "#ffffff") return "#d9dde3"; r = Math.round(r*f); g = Math.round(g*f); b = Math.round(b*f); return "#" + ((1<<24) + (r<<16) + (g<<8) + b).toString(16).slice(1); }
function CP(id, color, x, y, size){ const c = CHEX[color] || CHEX[DEFC[id]] || "#ccc"; const svgs = (COLART[id] || "").replace(/%C%/g, c).replace(/%D%/g, shade(c, .72));
  return `<g transform="translate(${x},${y}) scale(${(size/100).toFixed(3)})">${svgs}</g>`; }
function cgroup(id, color, n, cx, cy, w, h){
  const per = n <= 3 ? n : n === 4 ? 2 : n <= 9 ? 3 : 4, rows = Math.ceil(n/per);
  const s = Math.min(w/per, h/rows) * 0.9; let out = "";
  for(let i=0;i<n;i++){ const r = Math.floor(i/per), c = i % per, inRow = Math.min(per, n - r*per);
    out += CP(id, color, cx + (c - (inRow-1)/2)*s*1.05, cy + (r - (rows-1)/2)*s*1.05, s); }
  return out; }
const NUMW = ["zero","one","two","three","four","five","six","seven","eight","nine","ten"];
const PLURAL = {dress:"dresses", leaf:"leaves", fish:"fish"};
function phraseOf(it){ if(it.s) return (PERS.ME[it.s] || ["?"])[0]; if(it.n && it.n > 1) return `${NUMW[it.n]} ${PLURAL[it.obj] || it.obj + "s"}`; if(it.n === 1) return (/^[aeiou]/.test(it.obj) ? "an " : "a ") + it.obj;
  if(it.color) return (/^[aeiou]/.test(it.color) ? "an " : "a ") + it.color + " " + it.obj; return (/^[aeiou]/.test(it.obj) ? "an " : "a ") + it.obj; }
function phraseKey(it){ if(it.s) return `me:${it.s}`; return it.n ? `ph:${it.n}-${it.obj}` : `ph:${it.color || ""}-${it.obj}`; }
function mePics(it, cx, cy, w, h){ const pics = (PERS.ME[it.s] || [0, ["❓"]])[1]; const n = pics.length; const s = Math.min(h, w / n) * 0.85; let o = "";
  const DSZ = {athos: 1, lilo: .8, polo: .58}; pics.forEach((id, i) => { const k = DSZ[id] || 1; o += P(id, cx + (i - (n-1)/2) * s * 1.05, cy + s*(1-k)/2, s*k); }); return o; }
function fitSize(txt, w, base){ return Math.max(18, Math.min(base, Math.floor(w / (txt.length * 0.56)))); }
TPL.listen_repeat = (p, R, S) => {
  // p: {items:[{obj, color?} | {obj, n}] (1-2 = big pictures, 3-6 = review grid)}
  const items = p.items.slice(0, 6); let b = "";
  if(items.length <= 2){
    const w = 720 / items.length;
    items.forEach((it, i) => { const cx = w*(i + .5); const col = it.color || DEFC[it.obj];
      b += `<g class="snd lr" data-k="${phraseKey(it)}"><rect x="${cx - w/2 + 12}" y="10" width="${w - 24}" height="560" rx="26" fill="#fff" stroke="none"/>` +
        (it.s ? mePics(it, cx, 280, w - 40, items.length === 1 ? 360 : 260) : it.n ? cgroup(it.obj, col, it.n, cx, 280, w - 30, 460) : CP(it.obj, col, cx, 270, items.length === 1 ? 380 : 270)) + `</g>` + T(cx, 640, phraseOf(it), fitSize(phraseOf(it), w - 20, items.length === 1 ? 56 : 40), INK, 700); });
    return { title: p.title || "Listen and repeat", body: svg(720, 680, b), instr: "Listen and repeat. Escucha cada frase y repítela en voz alta. Toca el dibujo para oírla otra vez.", say: "t:lr", sayExtra: items.map(phraseKey), lr: items.length };
  }
  const cols = 3, rows = Math.ceil(items.length / 3);
  items.forEach((it, i) => { const c = i % cols, r = Math.floor(i/cols), cx = 120 + c*240, cy = 140 + r*300; const col = it.color || DEFC[it.obj];
    b += `<g class="snd lr" data-k="${phraseKey(it)}"><circle cx="${cx}" cy="${cy}" r="108" fill="${S.t}"/>` + (it.s ? mePics(it, cx, cy, 170, 150) : it.n ? cgroup(it.obj, col, it.n, cx, cy, 170, 170) : CP(it.obj, col, cx, cy, 150)) + `</g>` + T(cx, cy + 150, phraseOf(it), fitSize(phraseOf(it), 228, 30), INK, 700); });
  return { title: p.title || "Listen and repeat", body: svg(720, rows*300 + 30, b), instr: "Listen and repeat. Escucha cada frase y repítela en voz alta. Toca el dibujo para oírla otra vez.", say: "t:lr", sayExtra: items.map(phraseKey), lr: items.length };
};

  let b = box(10, 10, 700, 190, S.c, S.t, 24) + `<g class="snd" data-k="nm:${esc(nm)}">` + (p.pic ? P(p.pic, 90, 105, 110) : `<text x="90" y="125" font-size="64" text-anchor="middle">🔊</text>`) + `</g>` + T(420, 105 + size*0.36, nm, Math.min(size, 120), S.c);

$("#modal").addEventListener("click", e => { const b = e.target.closest("[data-m]"); if(!b){ if(e.target.id === "modal") $("#modal").style.display = "none"; return; }

  else if(m === "yes" && ask.fn) ask.fn(); });

/* ===================== Parents view ===================== */
let PT = "resumen", PDATA = null;
async function loadParents(){
  const out = {state: null, plans: [], results: []};
  if(DB){ try{ const s = await DB.doc("state/main").get(); if(s.exists) out.state = s.data(); }catch(e){}
    try{ const q = await DB.collection("plans").orderBy("date", "desc").limit(30).get(); out.plans = q.docs.map(d => d.data()); }catch(e){}
    try{ const q = await DB.collection("results").orderBy("ts", "desc").limit(800).get(); out.results = q.docs.map(d => d.data()); }catch(e){} }

const pctTag = p => `<span class="tag ${p >= 80 ? "g" : p >= 60 ? "y" : "r"}">${p} %</span>`;
function lvlIndex(code){ if(!code || code === "—") return -1; const g = "ABCDEFG".indexOf(code[0]); const n = parseInt(code.slice(1)); return g < 0 || !n ? -1 : g*6 + n - 1; }
const TIPS = {

 match_count: "Primero cuenten el grupo tocando cada dibujo; luego busquen ese número y únanlo con el dedo antes de trazar.",

 trace: "Primero tracen la forma con el dedo despacio, de arriba hacia abajo; luego con el lápiz siguiendo los puntos.",
 pick_initial: "Digan cada palabra alargando el primer sonido («mmmmono») y pregunten: ¿suena igual que «mmmamá»?",
 match_initial: "Digan la palabra exagerando el primer sonido y busquen la letra juntos.",
 choose_letter: "Digan la palabra despacio y exagerando el primer sonido; luego repasen el nombre de las tres letras.",
 find_letter: "Muéstrenle la letra modelo y que la nombre; luego que busque fila por fila tocando con el dedo.",
 say_items: "Repítanlo juntos con calma, modelando primero ustedes; con las sílabas, una palmada por cada golpe de voz (pa-to).",
 listen_choose: "Digan la palabra y señalen el dibujo; luego pídanle que lo señale él. Usen la palabra durante el día.",
 read_match: "Lean la palabra juntos sílaba por sílaba y busquen el dibujo.",
 paths: "Que recorra el camino primero con el dedo, despacio, sin salirse; luego con el lápiz, mirando hacia dónde va.",

 free_draw: "Pregúntenle qué dibujó y animen a agregar detalles (ojos, manos, pies); no se califica el realismo.",
 listen_repeat: "Escuchen la frase, repítanla juntos y luego que la diga solo; si se traba, partan la frase en dos.",

 trace_name: "Que trace su nombre letra por letra con el dedo antes de usar el lápiz."
};
function detHTML(r){ const d = r.det || []; const bad = d.length || (r.pct < 100 && !r.note); if(!bad) return "";
  return `<div style="margin-top:4px;font-size:13px;line-height:1.35">${r.img ? `<img src="${r.img}" onclick="this.style.width=this.style.width==='100%'?'160px':'100%'" style="width:160px;border:1.5px solid #e7e0d4;border-radius:8px;margin:4px 0;cursor:zoom-in;display:block" alt="Pantallazo de la hoja">` : ""}<div style="color:#a2463c">${d.length ? d.map(x => "• " + esc(x)).join("<br>") : "• Hubo errores, pero no quedó registrado cuáles (hoja anterior al detalle)."}</div>${TIPS[r.tpl] ? `<div style="color:#2f6b3f;margin-top:3px">💡 <b>Cómo ayudarlo:</b> ${esc(TIPS[r.tpl])}</div>` : ""}</div>`; }
function renderParents(){
  const D = PDATA || {state: null, plans: [], results: []}; const st = D.state || {}; const lv = st.levels || {};
  let h = `<button onclick="location.hash=''" style="font:inherit;font-weight:800;padding:8px 14px;border-radius:12px;border:2px solid #26303d;background:#fff;margin-bottom:10px">← Cuadernillos de Samuel</button><h1>Panel de mamá y papá</h1><div class="sub2">Progreso de Samuel · ${TODAY.split("-").reverse().join("/")}</div><div class="rb"></div>`;
  if(!DB) h += `<div class="note">⚠️ No se pudieron cargar los datos. Abre este enlace con tu cuenta de Claude iniciada.</div>`;
  if(DB && DB.local){ const st2 = (()=>{ try{ return localStorage.getItem("gh-status") || ""; }catch(e){ return ""; } })();
    h += ghToken() ? `<div class="note" style="color:#26303d">🔄 <b>Envío automático activado.</b> Los resultados se envían solos a Claude y aparecen en el panel de Claude. ${esc(st2)} <button data-pt="ghnow" style="font:inherit;font-weight:800;padding:4px 10px;border-radius:10px;border:2px solid #2f7fd1;background:#eef5fc">Enviar ahora</button></div>`
      : `<div class="note" style="color:#26303d">🔄 <b>Activar envío automático</b> (una sola vez): pega aquí la clave de GitHub.<br><input id="ghtok" style="width:100%;font:inherit;margin-top:6px;padding:8px;border-radius:10px;border:1.5px solid #c7cfd8" placeholder="github_pat_…"><button data-pt="ghsave" style="font:inherit;font-weight:800;margin-top:6px;padding:8px 16px;border-radius:10px;border:0;background:#3d9a5b;color:#fff">Guardar y enviar</button></div>`; }
  if(DB && DB.local && !ghToken()) h += `<div class="note" style="color:#26303d">📤 <b>Al final del día</b>, toca <button data-pt="send" style="font:inherit;font-weight:800;padding:6px 12px;border-radius:10px;border:2px solid #2f7fd1;background:#eef5fc">Enviar resultados a Claude</button>, copia el mensaje «Tarea de hoy lista…» y pégalo en el chat del proyecto Kumon Samuel en Claude. Yo actualizo el panel.</div>`;
  if(DB && !DB.local) h += `<div class="note" style="color:#26303d">📥 ¿Samuel trabajó en el iPad? <button data-pt="paste" style="font:inherit;font-weight:800;padding:6px 12px;border-radius:10px;border:2px solid #2f7fd1;background:#eef5fc">Pegar resultados del iPad</button><div id="pastebox" style="display:none;margin-top:8px"><textarea id="pastetxt" rows="4" style="width:100%;font:inherit;border-radius:10px;border:1.5px solid #c7cfd8;padding:8px" placeholder="Pega aquí el mensaje que enviaste desde el iPad"></textarea><button data-pt="clip" style="font:inherit;font-weight:800;margin:6px 6px 0 0;padding:8px 16px;border-radius:10px;border:2px solid #2f7fd1;background:#eef5fc">📋 Pegar del portapapeles</button><button data-pt="doimport" style="font:inherit;font-weight:800;margin-top:6px;padding:8px 16px;border-radius:10px;border:0;background:#3d9a5b;color:#fff">Guardar resultados</button><div id="pastemsg" style="margin-top:6px;font-weight:800"></div></div></div>`;
  h += `<div class="ptabs">${[["resumen","Resumen"],["hoy","Hoy"],["errores","Errores"],["historial","Historial"],["mapa","Mapa de niveles"]].map(([k,t]) => `<button data-pt="${k}" class="${PT===k?"on":""}">${t}</button>`).join("")}<button data-pt="reload">↻ Actualizar</button></div>`;
  const R = D.results;
  if(PT === "resumen"){
    h += `<div class="pcards">${ORDER.map(k => { const S = SUBJ[k], L = lv[k] || "—", i = lvlIndex(L); const rr = R.filter(r => r.subj === k); const last7 = rr.filter(r => (Date.now() - r.ts) < 7*864e5);
      const avg = last7.length ? Math.round(last7.reduce((a, r) => a + r.pct, 0)/last7.length) : null;
      return `<div class="pc" style="--c:${S.c}"><div class="k">${S.n}</div><div class="v">${esc(L)}</div><div class="k">${i >= 0 ? esc((CURR[k]||[])[i] || "") : "Por ubicar"}</div>
        <div class="pbar" style="margin-top:8px;--c:${S.c}"><i style="width:${i >= 0 ? Math.round(i/42*100) : 0}%"></i></div><div class="k" style="margin-top:6px">Ruta: ${i >= 0 ? Math.round(i/42*100) : 0} % · Promedio 7 días: ${avg === null ? "—" : avg + " %"} · Hojas: ${rr.length}</div></div>`; }).join("")}</div>`;
    if(st.notes) h += `<h2>Notas del plan</h2><div class="note" style="margin-top:0;color:#26303d">${esc(st.notes).replace(/\n/g, "<br>")}</div>`;
    const tests = R.filter(r => r.kind === "eval" || r.kind === "placement");
    h += `<h2>Pruebas</h2>${tests.length ? `<table><tr><th>Fecha</th><th>Materia</th><th>Tipo</th><th>Nivel</th><th>Resultado</th></tr>${tests.slice(0, 40).map(r => `<tr><td>${r.date}</td><td>${SUBJ[r.subj].n}</td><td>${r.kind === "eval" ? "Prueba de nivel" : "Ubicación"}</td><td>${esc(r.level)}</td><td>${r.got}/${r.tot} ${pctTag(r.pct)}</td></tr>`).join("")}</table>` : `<div class="note" style="margin-top:0">Aún no hay pruebas.</div>`}`;
    if(st.history && st.history.length) h += `<h2>Cambios de nivel</h2><table><tr><th>Fecha</th><th>Materia</th><th>Cambio</th></tr>${st.history.slice(-30).reverse().map(x => `<tr><td>${esc(x.date)}</td><td>${SUBJ[x.subj] ? SUBJ[x.subj].n : esc(x.subj)}</td><td>${esc(x.text)}</td></tr>`).join("")}</table>`;
  }
  if(PT === "hoy"){
    h += `<div class="note" style="margin-top:0">${planSource === "db" ? "Plan preparado para hoy." : "⚠️ El plan de hoy no estaba listo; Samuel tiene un repaso del último plan."} ${PLAN.note ? esc(PLAN.note) : ""}</div>`;
    h += `<table><tr><th>Materia</th><th>Hoja</th><th>Tipo</th><th>Estado</th></tr>${PLAN.sheets.map(s => { const r = R.find(x => x.date === TODAY && x.id === s.id) || RESULTS[s.id];
      return `<tr><td>${SUBJ[s.subj].n} ${esc(s.level || "")}</td><td>${esc(s.title || s.tpl)}</td><td>${KIND[s.kind] || ""}</td><td>${r ? `${r.got}/${r.tot} ${pctTag(r.pct)}${r.err ? ` · ${r.err} errores` : ""} · ${Math.round((r.secs||0)/60)} min${detHTML(r)}` : "Pendiente"}</td></tr>`; }).join("")}</table>`;
  }
  if(PT === "errores"){
    const E = R.filter(r => (r.det && r.det.length) || r.pct < 100).sort((a, b) => b.ts - a.ts).slice(0, 60);
    h += E.length ? `<div class="note" style="margin-top:0">Hojas con errores o incompletas (más recientes primero). Úsenlo para repasar con Samuel lo que le costó.</div><table><tr><th>Fecha</th><th>Materia</th><th>Hoja</th><th>Resultado y errores</th></tr>${E.map(r => `<tr><td>${r.date.split("-").reverse().slice(0,2).join("/")}</td><td>${SUBJ[r.subj].n}</td><td>${esc(r.title || r.tpl)}</td><td>${r.got}/${r.tot} ${pctTag(r.pct)}${r.note ? `<div style="font-size:13px;color:#3d9a5b">✓ ${esc(r.note)}</div>` : ""}${detHTML(r)}</td></tr>`).join("")}</table>` : `<div class="note" style="margin-top:0">¡Sin errores registrados! 🎉</div>`;
  }
  if(PT === "historial"){
    const days = [...new Set(R.map(r => r.date))].sort().reverse().slice(0, 21);
    h += days.length ? days.map(d => { const rs = R.filter(r => r.date === d); const avg = Math.round(rs.reduce((a, r) => a + r.pct, 0)/rs.length);
      return `<h2>${d.split("-").reverse().join("/")} · ${rs.length} hojas · promedio ${avg} %</h2><table><tr><th>Materia</th><th>Nivel</th><th>Hoja</th><th>Tipo</th><th>Resultado</th></tr>${rs.sort((a,b)=>ORDER.indexOf(a.subj)-ORDER.indexOf(b.subj)).map(r => `<tr><td>${SUBJ[r.subj].n}</td><td>${esc(r.level)}</td><td>${esc(r.title || r.tpl)}</td><td>${KIND[r.kind] || ""}</td><td>${r.got}/${r.tot} ${pctTag(r.pct)}${r.err ? ` · ${r.err} errores` : ""}${detHTML(r)}</td></tr>`).join("")}</table>`; }).join("") : `<div class="note" style="margin-top:0">Aún no hay resultados.</div>`;
  }
  if(PT === "mapa"){
    h += ORDER.map(k => { const S = SUBJ[k], i = lvlIndex(lv[k]);
      return `<h2 style="color:${S.c}">${S.n} · ${esc(lv[k] || "por ubicar")}</h2><div class="lvmap" style="--c:${S.c}">${Array.from({length: 42}, (_, j) => `<i class="${j < i ? "d" : j === i ? "c" : ""}" title="${esc((CURR[k]||[])[j] || "")}">${"ABCDEFG"[Math.floor(j/6)]}${j%6+1}</i>`).join("")}</div>${i >= 0 ? `<div class="sub2" style="margin:6px 0 0">Ahora: ${esc((CURR[k]||[])[i])} · Siguiente: ${esc((CURR[k]||[])[i+1] || "—")}</div>` : ""}`; }).join("");
    h += `<div class="note">Detalle completo de cada nivel (objetivos, evaluación y criterios) en la página «Ruta de aprendizaje de Samuel».</div>`;
  }
  $("#parents").innerHTML = h;
}
$("#parents").addEventListener("click", e => { const b = e.target.closest("[data-pt]"); if(!b) return; if(b.dataset.pt === "reload"){ loadParents(); return; } if(b.dataset.pt === "send"){ sendResults(); return; } if(b.dataset.pt === "ghsave"){ const v = (document.getElementById("ghtok").value || "").trim(); if(!v) return; try{ localStorage.setItem("gh-token", v); }catch(e){} ghUpload().then(ok => { if(!ok){ try{ localStorage.removeItem("gh-token"); }catch(e){} alert("La clave no funcionó. Revísala y vuelve a pegarla."); } renderParents(); }); return; } if(b.dataset.pt === "ghnow"){ ghUpload().then(renderParents); return; } if(b.dataset.pt === "paste"){ const x = document.getElementById("pastebox"); x.style.display = "block"; document.getElementById("pastetxt").focus(); return; } if(b.dataset.pt === "clip"){ navigator.clipboard.readText().then(x => { document.getElementById("pastetxt").value = x; importCode(x); }).catch(() => pasteMsg("No pude leer el portapapeles: mantén presionado el cuadro y elige «Pegar».")); return; } if(b.dataset.pt === "doimport"){ importCode(document.getElementById("pastetxt").value); return; } PT = b.dataset.pt; renderParents(); });
